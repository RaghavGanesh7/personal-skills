# server-health-check config. Sourced as bash by scripts/health_check.sh.
# Install: mkdir -p ~/.config/server-health && cp checks.conf ~/.config/server-health/
# Every setting is optional; leave an array empty to use auto-detection.

# System units that must be active. Empty = auto-detect enabled ones among
# docker, containerd, tailscaled, ssh, cockpit.socket, cron, NetworkManager.
REQUIRED_UNITS=()
# REQUIRED_UNITS=(docker.service tailscaled.service ssh.socket cockpit.socket)

# systemd --user units that must be active (also checks that linger is on).
REQUIRED_USER_UNITS=()
# REQUIRED_USER_UNITS=(hermes-gateway.service)

# Static LAN address to verify, as "interface=ip".
EXPECTED_IP=""
# EXPECTED_IP="wlo1=192.168.1.3"

# URLs that must answer 2xx/3xx. Empty = the Tailscale MagicDNS root, if Tailscale is up.
URLS=()
# URLS=(https://myhost.tailnet.ts.net/ https://myhost.tailnet.ts.net/portainer/ http://localhost:8888/)

# Log assertions for the unit's current run: "scope:unit|good-regex|bad-regex".
# FAIL when bad matches and good never does; WARN when good has not appeared yet.
LOG_CHECKS=()
# LOG_CHECKS=("user:hermes-gateway.service|Connected to Telegram|No adapter available")

# Anything else: "label|command that exits 0 when healthy" (30 s timeout each).
CMD_CHECKS=()
# CMD_CHECKS=(
#   "Claude Code logged in|claude auth status | grep -q '\"loggedIn\": true'"
#   "Nightly backup cron present|crontab -l | grep -q 'backup'"
#   "SearXNG JSON API|curl -fs 'http://localhost:8888/search?q=test&format=json' | grep -q results"
# )

# Thresholds
DISK_WARN=80
DISK_FAIL=90
SETTLE_SECONDS=180   # warn that results may be premature this soon after boot
CURL_TIMEOUT=8
